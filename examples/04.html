<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>10주차 예제 4 · 기본형 다섯 + 참조형 둘</title>
  <style>
    body { font-family: system-ui, sans-serif; line-height: 1.7; padding: 16px; }
    .note { padding: 10px 12px; border-left: 4px solid #102A56; background: #eef2fb; }
    .sandbox { margin: 16px 0; padding: 12px 16px; border: 1px dashed #9aa6b8; border-radius: 8px; }
    .sandbox h2 { font-size: 0.9rem; color: #55607a; margin: 0 0 8px; }
  </style>
</head>
<body>
  <p class="note">
    <strong>10주차 예제 4 · 기본형 다섯 + 참조형 둘</strong><br>
    결과는 개발자도구 <strong>콘솔</strong>에서 봅니다 — F12 또는 Ctrl+Shift+I (Mac은 Cmd+Option+I).
  </p>

  <div class="sandbox">
    <h2>연습용 화면 — 아래 코드가 손댈 요소들입니다. 마음대로 고쳐 보세요.</h2>
    <h1 id="title">제목 h1</h1>
    <p id="name">이름</p>
    <p id="price">12000</p>
    <div class="box">div.box</div>

    <ul id="list" class="list">
      <li>목록 1</li>
      <li>목록 2</li>
      <li>목록 3</li>
    </ul>

    <form id="myForm">
      <input type="text" name="name" placeholder="이름">
      <label><input type="checkbox" id="agree"> 동의합니다</label>
      <button type="button" id="btn">버튼</button>
    </form>
  </div>

  <script>
    /*
    10주차 예제 4 — 기본형 다섯 + 참조형 둘
    */
    // 기본형 (primitive)
    const s = '문자열';           // string
    const n = 42;                 // number  ← 정수·소수 구분 없음
    const b = true;               // boolean
    const u = undefined;          // 값이 아직 없음 (선언만 하고 대입 안 함)
    const nl = null;              // "비어 있음"을 의도적으로 표시

    // 참조형
    const arr = [1, 2, 3];        // 배열 (10주차)
    const obj = { a: 1 };         // 객체 (10주차)

    console.log(typeof s);        // "string"
    console.log(typeof n);        // "number"
    console.log(typeof nl);       // "object"  ← JavaScript의 유명한 버그입니다
  </script>
</body>
</html>
